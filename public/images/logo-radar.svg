<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Radome (full circle) -->
  <circle cx="12" cy="8" r="5"/>
  <!-- Tower truss -->
  <line x1="9" y1="13" x2="8" y2="22"/>
  <line x1="15" y1="13" x2="16" y2="22"/>
  <line x1="8" y1="22" x2="16" y2="22"/>
  <!-- Cross bracing -->
  <line x1="9" y1="15" x2="15" y2="15"/>
  <line x1="9" y1="15" x2="15.5" y2="18.5"/>
  <line x1="15" y1="15" x2="8.5" y2="18.5"/>
  <line x1="8.5" y1="18.5" x2="15.5" y2="18.5"/>
  <!-- Lightning bolt -->
  <polyline points="6,1 3,6 5,6 2,11" stroke="#fff" stroke-width="1.2" fill="none"/>
</svg>
